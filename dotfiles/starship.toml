# ~/.config/starship.toml — linked from ~/claude-computer/dotfiles/starship.toml
add_newline = false
format = "$hostname$directory$git_branch$git_status$python$nodejs$cmd_duration$line_break$character"

[hostname]
ssh_only = false          # always show the machine: this setup manages a fleet
format = "[$hostname]($style) "
style = "bold dimmed"

[directory]
truncation_length = 3
truncate_to_repo = true

[cmd_duration]
min_time = 5_000

[python]
format = "[py $version]($style) "

[nodejs]
format = "[node $version]($style) "
