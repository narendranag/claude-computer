<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!-- Generated by {{GENERATOR}} from the Markdown files in this folder. Do not edit by hand. -->
<style>
{{STYLE}}</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <button class="menu-btn" type="button" aria-label="Toggle menu">Menu</button>
    <p class="brand">{{BRAND}}</p>
    <p class="tagline">{{TAGLINE}}</p>
    <div class="collapsible">
{{BANNER}}      <input class="search" type="search" placeholder="Find a section" aria-label="Find a section">
      <div class="results"></div>
      <nav class="docs" aria-label="Documents">
{{NAV}}
      </nav>
{{MACHINE}}    </div>
  </aside>
  <main>
{{SECTIONS}}
  </main>
</div>
<script>
(function () {
  document.documentElement.classList.add('js');
  var docs = Array.prototype.slice.call(document.querySelectorAll('section.doc'));
  var navLinks = Array.prototype.slice.call(document.querySelectorAll('.docs a'));
  var sidebar = document.querySelector('.sidebar');
  var baseTitle = document.title;

  function show() {
    var id = decodeURIComponent(location.hash.slice(1)) || 'index';
    var el = document.getElementById(id);
    var sec = el && el.closest('section.doc');
    if (!sec) { sec = document.getElementById('index'); el = sec; }
    docs.forEach(function (d) { d.hidden = d !== sec; });
    navLinks.forEach(function (a) { a.classList.toggle('active', a.dataset.doc === sec.id); });
    document.title = sec.id === 'index' ? baseTitle : sec.dataset.title + ' · ' + baseTitle;
    sidebar.classList.remove('open');
    if (el === sec) { window.scrollTo(0, 0); } else { el.scrollIntoView(); }
  }
  window.addEventListener('hashchange', show);
  show();

  document.querySelector('.menu-btn').addEventListener('click', function () { sidebar.classList.toggle('open'); });

  var index = [];
  docs.forEach(function (d) {
    d.querySelectorAll('article h2, article h3').forEach(function (h) {
      index.push({ id: h.id, text: h.textContent, doc: d.dataset.title });
    });
  });
  var search = document.querySelector('.search');
  var results = document.querySelector('.results');
  var docNav = document.querySelector('.docs');
  search.addEventListener('input', function () {
    var q = search.value.trim().toLowerCase();
    results.textContent = '';
    docNav.hidden = !!q;
    if (!q) { return; }
    index.filter(function (e) { return (e.text + ' ' + e.doc).toLowerCase().indexOf(q) !== -1; })
      .slice(0, 30).forEach(function (e) {
        var a = document.createElement('a');
        a.href = '#' + e.id;
        a.textContent = e.text;
        var s = document.createElement('small');
        s.textContent = e.doc;
        a.appendChild(s);
        results.appendChild(a);
      });
    if (!results.children.length) { results.textContent = 'No matching section.'; }
  });
  results.addEventListener('click', function () { search.value = ''; results.textContent = ''; docNav.hidden = false; });
})();
</script>
</body>
</html>
