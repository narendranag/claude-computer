name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same shellcheck contributors get from Homebrew, not whatever apt has: Ubuntu's older
      # build numbers its findings differently (SC2317 vs SC2329) and has failed runs that were
      # clean locally.
      - name: Install shellcheck
        run: pipx install 'shellcheck-py>=0.11,<0.12' && shellcheck --version

      # bin/secrets and tests/secrets.sh run real sops and age on throwaway keys. sops is pinned
      # to the oldest release the scripts accept (3.11.0, the first with `sops set --value-stdin`),
      # so CI proves the floor; age comes from apt. gitleaks is pinned too: tests/secrets.sh checks
      # it passes ciphertext and catches an age private key.
      - name: Install sops, age and gitleaks
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          curl -fsSLo /tmp/sops https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64
          echo "775f1384d55decfad228e7196a3f683791914f92a473f78fc47700531c29dfef  /tmp/sops" | sha256sum -c -
          sudo install -m 755 /tmp/sops /usr/local/bin/sops
          curl -fsSLo /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          sops --disable-version-check --version && age --version && gitleaks version

      # Not every bin/ script is bash: some are Python behind a `uv run --script` shebang,
      # and neither has a file extension. Sort them by shebang so a new script needs no
      # wiring here, and fail loudly if the lists come back empty rather than passing.
      - name: List the scripts
        id: list
        run: |
          set -euo pipefail
          : > shell-scripts.txt
          : > python-scripts.txt
          for f in bin/* lib/*.sh ./*.sh tests/*.sh .githooks/* claude-global/hooks/*.sh; do
            [ -f "$f" ] || continue
            case "$(head -1 -- "$f")" in
              *bash*|*' sh'|*/sh)     echo "$f" >> shell-scripts.txt ;;
              *python*|*'uv run'*)    echo "$f" >> python-scripts.txt ;;
              *) case "$f" in *.sh) echo "$f" >> shell-scripts.txt ;; esac ;;
            esac
          done
          # lib/common.sh is sourced, not run, so it has no shebang of its own.
          grep -qxF lib/common.sh shell-scripts.txt || echo lib/common.sh >> shell-scripts.txt
          sort -u -o shell-scripts.txt shell-scripts.txt
          sort -u -o python-scripts.txt python-scripts.txt
          echo "--- shell ---"; cat shell-scripts.txt
          echo "--- python ---"; cat python-scripts.txt
          [ -s shell-scripts.txt ] || { echo "no shell scripts found — the globs are wrong"; exit 1; }

      # SC1091 only: every bin/ script sources lib/common.sh through `$(dirname "$0")/..`,
      # which shellcheck cannot resolve statically. Nothing else is excluded.
      - name: shellcheck
        run: xargs -r -a shell-scripts.txt shellcheck --exclude=SC1091 --

      # shellcheck parses; `bash -n` is the parser the scripts actually run under.
      - name: bash -n
        run: |
          set -euo pipefail
          while read -r f; do bash -n "$f"; done < shell-scripts.txt

      # install.sh runs before this repo exists on the machine, so it is the one script with
      # no lib/common.sh under it. Its dry-run matrix stubs every probe; CC_INSTALL_TEST_UNAME_S
      # in the test itself is the only way past the macOS gate, so this passes on ubuntu without
      # the gate being weakened for anyone else.
      - name: install.sh dry-run matrix
        run: ./tests/install-dry-run.sh

      # vault-setup downloads third-party plugin code, so its stubs answer for curl and gh and
      # nothing here reaches the network. git is real; gitleaks is a stub that passes, because
      # the runner has none and the vault's pre-commit hook needs one.
      - name: vault-setup matrix
        run: ./tests/vault-setup.sh

      # library-push pushes ~/library/books and ~/library/comics one-way to R2; rclone and
      # bw are stubs, so this never reaches Bitwarden or the network.
      - name: library-push matrix
        run: ./tests/library-push.sh

      # new-client turns a client folder into a private repo; git is real, gh and gitleaks are
      # stubs, so nothing reaches GitHub.
      - name: new-client matrix
        run: ./tests/new-client.sh

      # bin/secrets end to end: two machines, admit, revoke, import-env, exec, the paper key
      # through a pty — real sops and age, throwaway keys, a hermetic HOME.
      - name: secrets matrix
        run: ./tests/secrets.sh

      # setup-tools.sh --only vscode and --only agent-reach; `code`, `uv` and `npm` are stubs,
      # so nothing is ever installed.
      - name: setup-tools.sh dry-run and failure matrix
        run: ./tests/setup-tools-dry-run.sh

      - name: --help works
        run: |
          set -euo pipefail
          # Every bash script in bin/ answers --help without touching the machine.
          rc=0
          while read -r f; do
            case "$f" in bin/*) ;; *) continue ;; esac
            "$f" --help > /dev/null || { echo "no --help: $f"; rc=1; }
          done < shell-scripts.txt
          exit "$rc"

  json:
    name: json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the settings Claude Code loads
        run: |
          set -euo pipefail
          jq -e . claude-global/settings.json > /dev/null
          # A typo in a permission rule fails open, so check the shape too.
          jq -e '.permissions.deny | type == "array" and length > 0' claude-global/settings.json > /dev/null
          jq -e '.permissions.defaultMode == "auto"' claude-global/settings.json > /dev/null
          # Claude never decrypts: the secret-reading commands must be denied, the ones that run or
          # change something with secrets asked, and none of either may be allowed outright.
          jq -e '.permissions as $p
            | (["Bash(sops decrypt:*)", "Bash(sops -d:*)", "Bash(sops edit:*)", "Bash(sops exec-env:*)",
                "Bash(sops set:*)", "Bash(age -d:*)", "Bash(age-keygen:*)", "Bash(secrets env:*)",
                "Bash(secrets backup-key:*)", "Bash(secrets backup-verify:*)", "Bash(secrets set*--stdin*)",
                "Read(~/.config/sops/**)"] - $p.deny | length == 0)
            and (["Bash(secrets set:*)", "Bash(secrets import-env:*)", "Bash(secrets exec:*)",
                  "Bash(secrets admit:*)", "Bash(secrets revoke:*)", "Bash(secrets init:*)"] - $p.ask | length == 0)
            and ([$p.allow[] | select(test("sops (decrypt|edit|exec|set)|secrets (env|exec|set|import-env|backup)|age-keygen"))] | length == 0)' \
            claude-global/settings.json > /dev/null
      - name: Validate the issue-form templates
        run: |
          set -euo pipefail
          for f in .github/ISSUE_TEMPLATE/*.yml .github/workflows/*.yml; do
            python3 -c 'import sys,yaml; yaml.safe_load(open(sys.argv[1]))' "$f"
          done

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: ruff
        run: |
          set -euo pipefail
          # Same shebang split as the shell job: *.py plus the extensionless uv scripts.
          files=$(git ls-files '*.py')
          for f in bin/*; do
            [ -f "$f" ] || continue
            case "$(head -1 -- "$f")" in *python*|*'uv run'*) files="$files $f" ;; esac
          done
          echo "$files" | tr ' ' '\n'
          # shellcheck disable=SC2086
          uvx ruff@0.14.0 check $files
