# The shape of secrets/secrets.yaml: every secret the bin/ wrappers read, as <name>.<field>.
# Values stay empty here. The real file lives only in your private instance, sops-encrypted;
# fill it with `secrets set <name>.<field>` (or `secrets import-env`), never by editing it.
# `secrets check` compares the real store against this list, by name, without decrypting.
telegram:
  token: ""
  chat_id: ""
tavily:
  api_key: ""
firecrawl:
  api_key: ""
jina:
  api_key: ""
exa:
  api_key: ""
r2:
  access_key_id: ""
  secret_access_key: ""
  endpoint: ""
  bucket: ""
r2-crypt:
  password: ""
  salt: ""
google:
  credentials: ""
  token: ""
# Optional, set when you need them — `secrets check` lists them as missing until then:
openai:
  api_key: ""
google-maps:
  api_key: ""
duffel:
  api_key: ""
# Per app, added by /new-app:    posthog: { <app>: "" }
# Anything import-env doesn't recognise lands under env, as env.<variable name lowercased>:
#                                env: { stripe_secret_key: "" }
