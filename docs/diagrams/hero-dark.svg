<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Install the operator first</title><desc id="d">A terminal with the one command a human pastes — the installer one-liner, which puts the Xcode command line tools, Homebrew, the GitHub CLI and Claude Code on the machine and creates their private copy of the template — and then the handover: cd into that copy, start Claude Code, paste the first prompt. Beside it, the list of what Claude Code then sets up: machine map, keys, Tailscale, Bitwarden, hooks, Brewfiles, brains, workflows. The four commands can still be typed by hand.</desc><defs><marker id="m4FD1B0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#4FD1B0"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#2E2D34" stroke-width="3"/></pattern></defs><rect width="1280" height="420" fill="#141417"/><text x="48" y="78" font-size="12" font-weight="700" fill="#4FD1B0" text-anchor="start" letter-spacing="0.16em">AI-FIRST MACHINE SETUP</text><text x="46" y="136" font-size="48" font-weight="700" fill="#ECEAE4" text-anchor="start" letter-spacing="-0.02em">Install the</text><text x="46" y="188" font-size="48" font-weight="700" fill="#ECEAE4" text-anchor="start" letter-spacing="-0.02em">operator first.</text><text x="48" y="228" font-size="17.5" font-weight="400" fill="#A29E95" text-anchor="start">Paste one command. Claude Code sets up and</text><text x="48" y="253" font-size="17.5" font-weight="400" fill="#A29E95" text-anchor="start">runs everything else on your machines.</text><text x="48" y="274" font-size="13.5" font-weight="400" fill="#6F6B64" text-anchor="start">or type the four by hand</text><rect x="48" y="300" width="148" height="34" rx="17" fill="#F08A62" stroke="#F08A62" stroke-width="1.2" fill-opacity="0.18000000000000002"/><text x="122" y="322" font-size="13.5" font-weight="650" fill="#F08A62" text-anchor="middle">you authenticate</text><rect x="206" y="300" width="148" height="34" rx="17" fill="#E3B452" stroke="#E3B452" stroke-width="1.2" fill-opacity="0.18000000000000002"/><text x="280" y="322" font-size="13.5" font-weight="650" fill="#E3B452" text-anchor="middle">you set the mode</text><rect x="364" y="300" width="148" height="34" rx="17" fill="#86A6FF" stroke="#86A6FF" stroke-width="1.2" fill-opacity="0.18000000000000002"/><text x="438" y="322" font-size="13.5" font-weight="650" fill="#86A6FF" text-anchor="middle">you decide</text><text x="48" y="366" font-size="13" font-weight="500" fill="#6F6B64" text-anchor="start">The human&#x27;s three jobs. The rest is scripts, hooks and conversation.</text><rect x="536" y="49.5" width="392" height="324" rx="14" fill="#2E2D34" fill-opacity="0.55"/><rect x="536" y="48" width="392" height="324" rx="14" fill="#0C0C0F" stroke="#2A2A31" stroke-width="1"/><circle cx="556" cy="67" r="5" fill="#FF5F57"/><circle cx="572" cy="67" r="5" fill="#FEBC2E"/><circle cx="588" cy="67" r="5" fill="#28C840"/><text x="732.0" y="71" font-size="11" font-weight="600" fill="#8A8790" text-anchor="middle">Terminal.app</text><text x="556" y="122" font-size="11" font-weight="700" fill="#5F5C66" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">1</text><text x="576" y="122" font-size="12" font-weight="500" fill="#EDEBE6" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">$ /bin/bash -c &quot;$(curl -fsSL \</text><text x="596" y="146" font-size="12" font-weight="500" fill="#EDEBE6" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">https://claude-computer.com/install.sh)&quot;</text><text x="576" y="182" font-size="12" font-weight="500" fill="#8A8790" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"># Xcode CLT · Homebrew · gh · Claude Code</text><text x="576" y="204" font-size="12" font-weight="500" fill="#8A8790" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"># your private copy · the first prompt copied</text><text x="556" y="250" font-size="11" font-weight="700" fill="#5F5C66" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">2</text><text x="576" y="250" font-size="12" font-weight="500" fill="#EDEBE6" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">$ cd ~/claude-computer &amp;&amp; claude</text><text x="576" y="272" font-size="12" font-weight="500" fill="#8A8790" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"># log in, then check auto mode is on</text><rect x="554" y="326" width="356" height="28" rx="7" fill="#24242B"/><text x="568" y="345" font-size="12.5" font-weight="600" fill="#7EE0C3" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">› paste docs/FIRST-PROMPT.md</text><path d="M940,210.0 L980,210.0" fill="none" stroke="#4FD1B0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m4FD1B0)"/><rect x="992" y="49.5" width="240" height="324" rx="14" fill="#2E2D34" fill-opacity="0.55"/><rect x="992" y="48" width="240" height="324" rx="14" fill="#1D1D22" stroke="#2E2D34" stroke-width="1"/><text x="1014" y="82" font-size="14.5" font-weight="700" fill="#ECEAE4" text-anchor="start">Then Claude Code</text><circle cx="1022" cy="116" r="8.5" fill="#4FD1B0" fill-opacity="0.16"/><path d="M1018,116 L1021,119 L1026.5,112" fill="none" stroke="#4FD1B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="1040" y="120" font-size="13.5" font-weight="500" fill="#ECEAE4" text-anchor="start">maps the machine</text><circle cx="1022" cy="147" r="8.5" fill="#4FD1B0" fill-opacity="0.16"/><path d="M1018,147 L1021,150 L1026.5,143" fill="none" stroke="#4FD1B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="1040" y="151" font-size="13.5" font-weight="500" fill="#ECEAE4" text-anchor="start">adds its SSH key</text><circle cx="1022" cy="178" r="8.5" fill="#4FD1B0" fill-opacity="0.16"/><path d="M1018,178 L1021,181 L1026.5,174" fill="none" stroke="#4FD1B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="1040" y="182" font-size="13.5" font-weight="500" fill="#ECEAE4" text-anchor="start">joins the tailnet</text><circle cx="1022" cy="209" r="8.5" fill="#4FD1B0" fill-opacity="0.16"/><path d="M1018,209 L1021,212 L1026.5,205" fill="none" stroke="#4FD1B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="1040" y="213" font-size="13.5" font-weight="500" fill="#ECEAE4" text-anchor="start">wires Bitwarden</text><circle cx="1022" cy="240" r="8.5" fill="#4FD1B0" fill-opacity="0.16"/><path d="M1018,240 L1021,243 L1026.5,236" fill="none" stroke="#4FD1B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="1040" y="244" font-size="13.5" font-weight="500" fill="#ECEAE4" text-anchor="start">links hooks + commands</text><circle cx="1022" cy="271" r="8.5" fill="#4FD1B0" fill-opacity="0.16"/><path d="M1018,271 L1021,274 L1026.5,267" fill="none" stroke="#4FD1B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="1040" y="275" font-size="13.5" font-weight="500" fill="#ECEAE4" text-anchor="start">installs by role</text><circle cx="1022" cy="302" r="8.5" fill="#4FD1B0" fill-opacity="0.16"/><path d="M1018,302 L1021,305 L1026.5,298" fill="none" stroke="#4FD1B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="1040" y="306" font-size="13.5" font-weight="500" fill="#ECEAE4" text-anchor="start">builds the brains</text><circle cx="1022" cy="333" r="8.5" fill="#4FD1B0" fill-opacity="0.16"/><path d="M1018,333 L1021,336 L1026.5,329" fill="none" stroke="#4FD1B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="1040" y="337" font-size="13.5" font-weight="500" fill="#ECEAE4" text-anchor="start">files your meetings</text></svg>
