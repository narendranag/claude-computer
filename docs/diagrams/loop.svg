<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 606" width="1280" height="606" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">The session loop</title><desc id="d">Every Claude Code session: the SessionStart hook pulls the shared repo and checks secrets; Claude identifies the machine and reads its file and the fleet index; it works; it records changes in the machine file, decisions and tasks; the Stop hook commits and pushes docs, so the next machine&#x27;s session starts current.</desc><defs><marker id="m3355D1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#3355D1"/></marker><marker id="mA39E95" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#A39E95"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#E3DFD6" stroke-width="3"/></pattern></defs><rect width="1280" height="606" fill="#FBFAF7"/><text x="48" y="58" font-size="11.5" font-weight="700" fill="#0E7C66" text-anchor="start" letter-spacing="0.14em">DIAGRAM 3 · THE BRAIN</text><text x="48" y="92" font-size="27" font-weight="650" fill="#1C1B19" text-anchor="start" letter-spacing="-0.01em">One shared repo. Every machine writes only its own file.</text><text x="48" y="120" font-size="14.5" font-weight="400" fill="#6E6A63" text-anchor="start">Hooks make the sync automatic; ownership rules make conflicts rare by construction.</text><rect x="48" y="177.5" width="222" height="164" rx="14" fill="#E3DFD6" fill-opacity="0.55"/><rect x="48" y="176" width="222" height="164" rx="14" fill="#FFFFFF" stroke="#E3DFD6" stroke-width="1"/><rect x="48" y="176" width="222" height="5" rx="2.5" fill="#2F5BD3"/><text x="66" y="210" font-size="12" font-weight="700" fill="#2F5BD3" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">1</text><text x="84" y="210" font-size="15" font-weight="700" fill="#1C1B19" text-anchor="start">SessionStart hook</text><rect x="66" y="224" width="70" height="19" rx="9.5" fill="#2F5BD3" stroke="#2F5BD3" stroke-width="1" fill-opacity="0.08"/><text x="101.0" y="237.28" font-size="10.5" font-weight="600" fill="#2F5BD3" text-anchor="middle">automatic</text><text x="66" y="272" font-size="12" font-weight="500" fill="#1C1B19" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">git pull --rebase</text><text x="66" y="293" font-size="12.5" font-weight="400" fill="#6E6A63" text-anchor="start">Bitwarden locked?</text><text x="66" y="314" font-size="12" font-weight="500" fill="#1C1B19" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">tasks-sync</text><line x1="272" y1="258.0" x2="285" y2="258.0" stroke="#A39E95" stroke-width="1.6" stroke-linecap="round" marker-end="url(#mA39E95)"/><rect x="287" y="177.5" width="222" height="164" rx="14" fill="#E3DFD6" fill-opacity="0.55"/><rect x="287" y="176" width="222" height="164" rx="14" fill="#FFFFFF" stroke="#E3DFD6" stroke-width="1"/><rect x="287" y="176" width="222" height="5" rx="2.5" fill="#2F5BD3"/><text x="305" y="210" font-size="12" font-weight="700" fill="#2F5BD3" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">2</text><text x="323" y="210" font-size="15" font-weight="700" fill="#1C1B19" text-anchor="start">Orient</text><rect x="305" y="224" width="70" height="19" rx="9.5" fill="#2F5BD3" stroke="#2F5BD3" stroke-width="1" fill-opacity="0.08"/><text x="340.0" y="237.28" font-size="10.5" font-weight="600" fill="#2F5BD3" text-anchor="middle">CLAUDE.md</text><text x="305" y="272" font-size="12.5" font-weight="400" fill="#6E6A63" text-anchor="start">identify host</text><text x="305" y="293" font-size="12" font-weight="500" fill="#1C1B19" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">machines/&lt;host&gt;.md</text><text x="305" y="314" font-size="12" font-weight="500" fill="#1C1B19" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">FLEET.md</text><line x1="511" y1="258.0" x2="524" y2="258.0" stroke="#A39E95" stroke-width="1.6" stroke-linecap="round" marker-end="url(#mA39E95)"/><rect x="526" y="177.5" width="222" height="164" rx="14" fill="#E3DFD6" fill-opacity="0.55"/><rect x="526" y="176" width="222" height="164" rx="14" fill="#FFFFFF" stroke="#E3DFD6" stroke-width="1"/><rect x="526" y="176" width="222" height="5" rx="2.5" fill="#B07A12"/><text x="544" y="210" font-size="12" font-weight="700" fill="#B07A12" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">3</text><text x="562" y="210" font-size="15" font-weight="700" fill="#1C1B19" text-anchor="start">Work</text><rect x="544" y="224" width="76" height="19" rx="9.5" fill="#B07A12" stroke="#B07A12" stroke-width="1" fill-opacity="0.08"/><text x="582.0" y="237.28" font-size="10.5" font-weight="600" fill="#B07A12" text-anchor="middle">you decide</text><text x="544" y="272" font-size="12.5" font-weight="400" fill="#6E6A63" text-anchor="start">install, configure,</text><text x="544" y="293" font-size="12.5" font-weight="400" fill="#6E6A63" text-anchor="start">manage boxes over SSH</text><text x="544" y="314" font-size="12.5" font-weight="400" fill="#6E6A63" text-anchor="start">ask before destructive</text><line x1="750" y1="258.0" x2="763" y2="258.0" stroke="#A39E95" stroke-width="1.6" stroke-linecap="round" marker-end="url(#mA39E95)"/><rect x="765" y="177.5" width="222" height="164" rx="14" fill="#E3DFD6" fill-opacity="0.55"/><rect x="765" y="176" width="222" height="164" rx="14" fill="#FFFFFF" stroke="#E3DFD6" stroke-width="1"/><rect x="765" y="176" width="222" height="5" rx="2.5" fill="#2F5BD3"/><text x="783" y="210" font-size="12" font-weight="700" fill="#2F5BD3" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">4</text><text x="801" y="210" font-size="15" font-weight="700" fill="#1C1B19" text-anchor="start">Record</text><rect x="783" y="224" width="89" height="19" rx="9.5" fill="#2F5BD3" stroke="#2F5BD3" stroke-width="1" fill-opacity="0.08"/><text x="827.5" y="237.28" font-size="10.5" font-weight="600" fill="#2F5BD3" text-anchor="middle">same session</text><text x="783" y="272" font-size="12" font-weight="500" fill="#1C1B19" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">update machines/&lt;host&gt;.md</text><text x="783" y="293" font-size="12" font-weight="500" fill="#1C1B19" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">append DECISIONS.md</text><text x="783" y="314" font-size="12" font-weight="500" fill="#1C1B19" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">TASKS.md · map-check</text><line x1="989" y1="258.0" x2="1002" y2="258.0" stroke="#A39E95" stroke-width="1.6" stroke-linecap="round" marker-end="url(#mA39E95)"/><rect x="1004" y="177.5" width="222" height="164" rx="14" fill="#E3DFD6" fill-opacity="0.55"/><rect x="1004" y="176" width="222" height="164" rx="14" fill="#FFFFFF" stroke="#E3DFD6" stroke-width="1"/><rect x="1004" y="176" width="222" height="5" rx="2.5" fill="#2F5BD3"/><text x="1022" y="210" font-size="12" font-weight="700" fill="#2F5BD3" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">5</text><text x="1040" y="210" font-size="15" font-weight="700" fill="#1C1B19" text-anchor="start">Stop hook</text><rect x="1022" y="224" width="70" height="19" rx="9.5" fill="#2F5BD3" stroke="#2F5BD3" stroke-width="1" fill-opacity="0.08"/><text x="1057.0" y="237.28" font-size="10.5" font-weight="600" fill="#2F5BD3" text-anchor="middle">automatic</text><text x="1022" y="272" font-size="12" font-weight="500" fill="#1C1B19" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">commit docs/ as [host]</text><text x="1022" y="293" font-size="12" font-weight="500" fill="#1C1B19" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">git push</text><text x="1022" y="314" font-size="12" font-weight="500" fill="#1C1B19" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">tg-send if long</text><rect x="48" y="421.5" width="1184" height="108" rx="14" fill="#E3DFD6" fill-opacity="0.55"/><rect x="48" y="420" width="1184" height="108" rx="14" fill="#F3F1EC" stroke="#E3DFD6" stroke-width="1"/><circle cx="76" cy="446" r="8.5" fill="none" stroke="#3355D1" stroke-width="1.6"/><path d="M73,442 L73,450 M79,444 C79,447 73,446 73,448.5" fill="none" stroke="#3355D1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="79" cy="443" r="1.5" fill="#3355D1"/><text x="96" y="451" font-size="15" font-weight="700" fill="#1C1B19" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">claude-computer</text><text x="258" y="451" font-size="12.5" font-weight="400" fill="#6E6A63" text-anchor="start">private · cloned on every manager</text><rect x="66.0" y="470" width="220.0" height="44" rx="8" fill="#FFFFFF" stroke="#E3DFD6" stroke-width="1"/><rect x="66.0" y="470" width="4" height="44" rx="2" fill="#2F5BD3"/><text x="82.0" y="488" font-size="12" font-weight="650" fill="#1C1B19" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">machines/laptop.md</text><text x="82.0" y="505" font-size="11" font-weight="400" fill="#6E6A63" text-anchor="start">written only by laptop</text><rect x="298.0" y="470" width="220.0" height="44" rx="8" fill="#FFFFFF" stroke="#E3DFD6" stroke-width="1"/><rect x="298.0" y="470" width="4" height="44" rx="2" fill="#B07A12"/><text x="314.0" y="488" font-size="12" font-weight="650" fill="#1C1B19" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">machines/desktop.md</text><text x="314.0" y="505" font-size="11" font-weight="400" fill="#6E6A63" text-anchor="start">written only by desktop</text><rect x="530.0" y="470" width="220.0" height="44" rx="8" fill="#FFFFFF" stroke="#E3DFD6" stroke-width="1"/><rect x="530.0" y="470" width="4" height="44" rx="2" fill="#A39E95"/><text x="546.0" y="488" font-size="12" font-weight="650" fill="#1C1B19" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">machines/nas.md</text><text x="546.0" y="505" font-size="11" font-weight="400" fill="#6E6A63" text-anchor="start">whichever manager touched it</text><rect x="762.0" y="470" width="220.0" height="44" rx="8" fill="#FFFFFF" stroke="#E3DFD6" stroke-width="1"/><rect x="762.0" y="470" width="4" height="44" rx="2" fill="#A39E95"/><text x="778.0" y="488" font-size="12" font-weight="650" fill="#1C1B19" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">FLEET.md</text><text x="778.0" y="505" font-size="11" font-weight="400" fill="#6E6A63" text-anchor="start">index · rarely changes</text><rect x="994.0" y="470" width="220.0" height="44" rx="8" fill="#FFFFFF" stroke="#E3DFD6" stroke-width="1"/><rect x="994.0" y="470" width="4" height="44" rx="2" fill="#A39E95"/><text x="1010.0" y="488" font-size="12" font-weight="650" fill="#1C1B19" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">DECISIONS.md</text><text x="1010.0" y="505" font-size="11" font-weight="400" fill="#6E6A63" text-anchor="start">append-only · always merges</text><path d="M1115.0,343 L1115.0,416" fill="none" stroke="#3355D1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m3355D1)"/><text x="1125.0" y="384" font-size="12" font-weight="650" fill="#3355D1" text-anchor="start">push</text><path d="M159.0,416 L159.0,343" fill="none" stroke="#3355D1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m3355D1)"/><text x="169.0" y="384" font-size="12" font-weight="650" fill="#3355D1" text-anchor="start">pull</text><rect x="49" y="562" width="18" height="12" rx="1.5" fill="none" stroke="#6E6A63" stroke-width="1.6"/><path d="M58,574 L58,578 M54,578 L62,578" fill="none" stroke="#6E6A63" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="575" font-size="13" font-weight="500" fill="#6E6A63" text-anchor="start">Next morning, on the desktop: the SessionStart hook pulls — the laptop&#x27;s changes are already there.</text><rect x="812" y="561.0" width="16" height="5" rx="1.2" fill="none" stroke="#6E6A63" stroke-width="1.4"/><circle cx="815.5" cy="563.5" r="0.9" fill="#6E6A63"/><rect x="812" y="567.2" width="16" height="5" rx="1.2" fill="none" stroke="#6E6A63" stroke-width="1.4"/><circle cx="815.5" cy="569.7" r="0.9" fill="#6E6A63"/><rect x="812" y="573.4" width="16" height="5" rx="1.2" fill="none" stroke="#6E6A63" stroke-width="1.4"/><circle cx="815.5" cy="575.9" r="0.9" fill="#6E6A63"/><text x="840" y="575" font-size="13" font-weight="500" fill="#6E6A63" text-anchor="start">Changed a headless box? Copy its file to the box too.</text></svg>
