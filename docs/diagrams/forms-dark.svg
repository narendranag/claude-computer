 stroke-width="1"/><text x="961.0" y="419" font-size="11.5" font-weight="550" fill="#ECEAE4" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">gmail</text><rect x="995" y="404" width="61" height="22" rx="6" fill="#18181C" stroke="#2E2D34" stroke-width="1"/><text x="1025.5" y="419" font-size="11.5" font-weight="550" fill="#ECEAE4" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">gdrive</text><text x="790" y="456" font-size="11" font-weight="700" fill="#6F6B64" text-anchor="start" letter-spacing="0.1em">STORAGE</text><rect x="880" y="442" width="105" height="22" rx="6" fill="#18181C" stroke="#2E2D34" stroke-width="1"/><text x="932.5" y="457" font-size="11.5" font-weight="550" fill="#ECEAE4" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">archive-push</text><rect x="992" y="442" width="105" height="22" rx="6" fill="#18181C" stroke="#2E2D34" stroke-width="1"/><text x="1044.5" y="457" font-size="11.5" font-weight="550" fill="#ECEAE4" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">archive-pull</text><rect x="880" y="470" width="112" height="22" rx="6" fill="#18181C" stroke="#2E2D34" stroke-width="1"/><text x="936.0" y="485" font-size="11.5" font-weight="550" fill="#ECEAE4" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">camera-ingest</text><rect x="999" y="470" width="105" height="22" rx="6" fill="#18181C" stroke="#2E2D34" stroke-width="1"/><text x="1051.5" y="485" font-size="11.5" font-weight="550" fill="#ECEAE4" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">library-push</text><rect x="880" y="498" width="120" height="22" rx="6" fill="#18181C" stroke="#2E2D34" stroke-width="1"/><text x="940.0" y="513" font-size="11.5" font-weight="550" fill="#ECEAE4" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">resources-sync</text><text x="790" y="550" font-size="11" font-weight="700" fill="#6F6B64" text-anchor="start" letter-spacing="0.1em">DAILY</text><rect x="880" y="536" width="91" height="22" rx="6" fill="#18181C" stroke="#2E2D34" stroke-width="1"/><text x="925.5" y="551" font-size="11.5" font-weight="550" fill="#ECEAE4" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">feeds-sync</text><rect x="978" y="536" width="134" height="22" rx="6" fill="#18181C" stroke="#2E2D34" stroke-width="1"/><text x="1045.0" y="551" font-size="11.5" font-weight="550" fill="#ECEAE4" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">transcripts-sync</text><rect x="1119" y="536" width="69" height="22" rx="6" fill="#18181C" stroke="#2E2D34" stroke-width="1"/><text x="1153.5" y="551" font-size="11.5" font-weight="550" fill="#ECEAE4" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">new-app</text><rect x="880" y="564" width="32" height="22" rx="6" fill="#18181C" stroke="#2E2D34" stroke-width="1"/><text x="896.0" y="579" font-size="11.5" font-weight="550" fill="#ECEAE4" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">wt</text><text x="790" y="612" font-size="12" font-weight="500" fill="#A29E95" text-anchor="start">Keys via bw get · output prefixed [host] · exit codes, not prose</text></svg>
