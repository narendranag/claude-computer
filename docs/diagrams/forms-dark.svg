<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="1280" height="680" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Four forms, one rule</title><desc id="d">Workflows take four forms: scripts in bin/ for anything deterministic; slash commands when judgment or a conversation is needed; hooks for what must happen every time; scheduled jobs for what must happen without a session. Commands, hooks and schedules all call scripts rather than reimplementing them.</desc><defs><marker id="m6F6B64" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#6F6B64"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#2E2D34" stroke-width="3"/></pattern></defs><rect width="1280" height="680" fill="#141417"/><text x="48" y="58" font-size="11.5" font-weight="700" fill="#4FD1B0" text-anchor="start" letter-spacing="0.14em">DIAGRAM 4 · WORKFLOWS</text><text x="48" y="92" font-size="27" font-weight="650" fill="#ECEAE4" text-anchor="start" letter-spacing="-0.01em">If it can be a script, it&#x27;s a script.</text><text x="48" y="120" font-size="14.5" font-weight="400" fill="#A29E95" text-anchor="start">Everything else is a way of deciding when a script runs — and who, if anyone, has to be in the room.</text><rect x="48" y="177.5" width="600" height="112" rx="14" fill="#2E2D34" fill-opacity="0.55"/><rect x="48" y="176" width="600" height="112" rx="14" fill="#1D1D22" stroke="#2E2D34" stroke-width="1"/><rect x="48" y="176" width="5" height="112" rx="2.5" fill="#E3B452"/><text x="72" y="208" font-size="17" font-weight="700" fill="#ECEAE4" text-anchor="start">Slash command</text><text x="72" y="228" font-size="13" font-weight="400" fill="#A29E95" text-anchor="start">needs judgment or a conversation</text><text x="72" y="268" font-size="11.5" font-weight="600" fill="#E3B452" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">claude-global/commands/</text><rect x="348" y="202" width="92" height="22" rx="11.0" fill="#E3B452" stroke="#E3B452" stroke-width="1" fill-opacity="0.14"/><text x="394.0" y="216.96" font-size="11" font-weight="600" fill="#E3B452" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">/inbox</text><rect x="446" y="202" width="92" height="22" rx="11.0" fill="#E3B452" stroke="#E3B452" stroke-width="1" fill-opacity="0.14"/><text x="492.0" y="216.96" font-size="11" font-weight="600" fill="#E3B452" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">/transcripts</text><rect x="544" y="202" width="92" height="22" rx="11.0" fill="#E3B452" stroke="#E3B452" stroke-width="1" fill-opacity="0.14"/><text x="590.0" y="216.96" font-size="11" font-weight="600" fill="#E3B452" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">/today</text><rect x="348" y="232" width="92" height="22" rx="11.0" fill="#E3B452" stroke="#E3B452" stroke-width="1" fill-opacity="0.14"/><text x="394.0" y="246.96" font-size="11" font-weight="600" fill="#E3B452" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">/new-app</text><rect x="446" y="232" width="92" height="22" rx="11.0" fill="#E3B452" stroke="#E3B452" stroke-width="1" fill-opacity="0.14"/><text x="492.0" y="246.96" font-size="11" font-weight="600" fill="#E3B452" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">/review</text><rect x="544" y="232" width="92" height="22" rx="11.0" fill="#E3B452" stroke="#E3B452" stroke-width="1" fill-opacity="0.14"/><text x="590.0" y="246.96" font-size="11" font-weight="600" fill="#E3B452" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">/setup</text><path d="M652,232.0 C708,232.0 708,406.0 760,406.0" fill="none" stroke="#6F6B64" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m6F6B64)"/><rect x="48" y="331.0" width="600" height="110" rx="14" fill="#2E2D34" fill-opacity="0.55"/><rect x="48" y="329.5" width="600" height="110" rx="14" fill="#1D1D22" stroke="#2E2D34" stroke-width="1"/><rect x="48" y="329.5" width="5" height="110" rx="2.5" fill="#F08A62"/><text x="72" y="361.5" font-size="17" font-weight="700" fill="#ECEAE4" text-anchor="start">Hook</text><text x="72" y="381.5" font-size="13" font-weight="400" fill="#A29E95" text-anchor="start">must happen every time, without asking</text><text x="72" y="419.5" font-size="11.5" font-weight="600" fill="#F08A62" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">claude-global/settings.json</text><text x="348" y="361.5" font-size="11.5" font-weight="500" fill="#ECEAE4" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">SessionStart → pull · transcripts · tasks</text><text x="348" y="381.5" font-size="11.5" font-weight="500" fill="#ECEAE4" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">Stop → push docs/ · tg-send</text><text x="348" y="401.5" font-size="11.5" font-weight="500" fill="#ECEAE4" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">Notification → tg-send</text><path d="M652,384.5 C708,384.5 708,406.0 760,406.0" fill="none" stroke="#6F6B64" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m6F6B64)"/><rect x="48" y="482.5" width="600" height="155" rx="14" fill="#2E2D34" fill-opacity="0.55"/><rect x="48" y="481.0" width="600" height="155" rx="14" fill="#1D1D22" stroke="#2E2D34" stroke-width="1"/><rect x="48" y="481.0" width="5" height="155" rx="2.5" fill="#F2A444"/><text x="72" y="513.0" font-size="17" font-weight="700" fill="#ECEAE4" text-anchor="start">Scheduled job</text><text x="72" y="533.0" font-size="13" font-weight="400" fill="#A29E95" text-anchor="start">must happen without a session</text><text x="72" y="616.0" font-size="11.5" font-weight="600" fill="#F2A444" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">bin/schedule → launchd</text><text x="348" y="509.0" font-size="11" font-weight="700" fill="#F2A444" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">on change</text><text x="432" y="509.0" font-size="11.5" font-weight="500" fill="#ECEAE4" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">transcripts-sync</text><text x="348" y="526.0" font-size="11" font-weight="700" fill="#F2A444" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">hourly</text><text x="432" y="526.0" font-size="11.5" font-weight="500" fill="#ECEAE4" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">tasks-sync, resources-sync</text><text x="348" y="543.0" font-size="11" font-weight="700" fill="#F2A444" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">06:00</text><text x="432" y="543.0" font-size="11.5" font-weight="500" fill="#ECEAE4" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">feeds-sync</text><text x="348" y="560.0" font-size="11" font-weight="700" fill="#F2A444" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">06:30</text><text x="432" y="560.0" font-size="11.5" font-weight="500" fill="#ECEAE4" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">daily note</text><text x="348" y="577.0" font-size="11" font-weight="700" fill="#F2A444" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">09:00</text><text x="432" y="577.0" font-size="11.5" font-weight="500" fill="#ECEAE4" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">map-check</text><text x="348" y="594.0" font-size="11" font-weight="700" fill="#F2A444" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">weekly</text><text x="432" y="594.0" font-size="11.5" font-weight="500" fill="#ECEAE4" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">library-push</text><path d="M652,558.5 C708,558.5 708,406.0 760,406.0" fill="none" stroke="#6F6B64" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m6F6B64)"/><rect x="764" y="177.5" width="468" height="460" rx="14" fill="#2E2D34" fill-opacity="0.55"/><rect x="764" y="176" width="468" height="460" rx="14" fill="#1D1D22" stroke="#4FD1B0" stroke-width="1"/><rect x="764" y="176" width="468" height="5" rx="2.5" fill="#4FD1B0"/><text x="790" y="216" font-size="20" font-weight="700" fill="#ECEAE4" text-anchor="start">Script</text><text x="790" y="238" font-size="13" font-weight="400" fill="#A29E95" text-anchor="start">deterministic · no judgment · answers --help</text><text x="1206" y="216" font-size="16" font-weight="700" fill="#4FD1B0" text-anchor="end" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">bin/</text><text x="790" y="286" font-size="11" font-weight="700" fill="#6F6B64" text-anchor="start" letter-spacing="0.1em">PLUMBING</text><rect x="880" y="272" width="120" height="22" rx="6" fill="#18181C" stroke="#2E2D34" stroke-width="1"/><text x="940.0" y="287" font-size="11.5" font-weight="550" fill="#ECEAE