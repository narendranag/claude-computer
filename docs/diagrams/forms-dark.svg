<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 624" width="1280" height="624" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Four forms, one rule</title><desc id="d">Workflows take four forms: scripts in bin/ for anything deterministic; slash commands when judgment or a conversation is needed; hooks for what must happen every time; scheduled jobs for what must happen without a session. Commands, hooks and schedules all call scripts rather than reimplementing them.</desc><defs><marker id="m6F6B64" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#6F6B64"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#2E2D34" stroke-width="3"/></pattern></defs><rect width="1280" height="624" fill="#141417"/><text x="48" y="58" font-size="11.5" font-weight="700" fill="#4FD1B0" text-anchor="start" letter-spacing="0.14em">DIAGRAM 4 · WORKFLOWS</text><text x="48" y="92" font-size="27" font-weight="650" fill="#ECEAE4" text-anchor="start" letter-spacing="-0.01em">If it can be a script, it&#x27;s a script.</text><text x="48" y="120" font-size="14.5" font-weight="400" fill="#A29E95" text-anchor="start">Everything else is a way of deciding when a script runs — and who, if anyone, has to be in the room.</text><rect x="48" y="177.5" width="600" height="124" rx="14" fill="#2E2D34" fill-opacity="0.55"/><rect x="48" y="176" width="600" height="124" rx="14" fill="#1D1D22" stroke="#2E2D34" stroke-width="1"/><rect x="48" y="176" width="5" height="124" rx="2.5" fill="#E3B452"/><text x="72" y="208" font-size="17" font-weight="700" fill="#ECEAE4" text-anchor="start">Slash command</text><text x="72" y="228" font-size="13" font-weight="400" fill="#A29E95" text-anchor="start">needs judgment or a conversation</text><text x="72" y="280" font-size="11.5" font-weight="600" fill="#E3B452" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">claude-global/commands/</text><rect x="348" y="202" width="92" height="22" rx="11.0" fill="#E3B452" stroke="#E3B452" stroke-width="1" fill-opacity="0.14"/><text x="394.0" y="216.96" font-size="11" font-weight="600" fill="#E3B452" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">/inbox</text><rect x="446" y="202" width="92" height="22" rx="11.0" fill="#E3B452" stroke="#E3B452" stroke-width="1" fill-opacity="0.14"/><text x="492.0" y="216.96" font-size="11" font-weight="600" fill="#E3B452" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">/transcripts</text><rect x="544" y="202" width="92" height="22" rx="11.0" fill="#E3B452" stroke="#E3B452" stroke-width="1" fill-opacity="0.14"/><text x="590.0" y="216.96" font-size="11" font-weight="600" fill="#E3B452" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">/today</text><rect x="348" y="232" width="92" height="22" rx="11.0" fill="#E3B452" stroke="#E3B452" stroke-width="1" fill-opacity="0.14"/><text x="394.0" y="246.96" font-size="11" font-weight="600" fill="#E3B452" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">/new-app</text><rect x="446" y="232" width="92" height="22" rx="11.0" fill="#E3B452" stroke="#E3B452" stroke-width="1" fill-opacity="0.14"/><text x="492.0" y="246.96" font-size="11" font-weight="600" fill="#E3B452" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">/review</text><rect x="544" y="232" width="92" height="22" rx="11.0" fill="#E3B452" stroke="#E3B452" stroke-width="1" fill-opacity="0.14"/><text x="590.0" y="246.96" font-size="11" font-weight="600" fill="#E3B452" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">/setup</text><path d="M652,238.0 C708,238.0 708,376 760,376" fill="none" stroke="#6F6B64" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m6F6B64)"/><rect x="48" y="317.5" width="600" height="124" rx="14" fill="#2E2D34" fill-opacity="0.55"/><rect x="48" y="316" width="600" height="124" rx="14" fill="#1D1D22" stroke="#2E2D34" stroke-width="1"/><rect x="48" y="316" width="5" height="124" rx="2.5" fill="#F08A62"/><text x="72" y="348" font-size="17" font-weight="700" fill="#ECEAE4" text-anchor="start">Hook</text><text x="72" y="368" font-size="13" font-weight="400" fill="#A29E95" text-anchor="start">must happen every time, without asking</text><text x="72" y="420" font-size="11.5" font-weight="600" fill="#F08A62" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">claude-global/settings.json</text><text x="348" y="348" font-size="11.5" font-weight="500" fill="#ECEAE4" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">SessionStart → pull · transcripts · tasks</text><text x="348" y="368" font-size="11.5" font-weight="500" fill="#ECEAE4" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">Stop → push docs/ · tg-send</text><text x="348" y="388" font-size="11.5" font-weight="500" fill="#ECEAE4" text-anchor="start" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace">Notification → tg-send</text><path d="M652,378.0 C708,378.0 708,376 760,376" fill="none" stroke="#6F6B64" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m6F6B64)"/><rect x="48" y="457.5" width="600" height="124" rx="14" fill="#2E2D34" fill-opacity="0.55"/><rect x="48" y="456" width="600" height="124" rx="14" fill="#1D1D22" stroke="#2E2D34" stroke-width="1"/><rect x="48" 